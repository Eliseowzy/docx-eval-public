name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Scoring and the editing checks use the standard library only, so there is
      # nothing to install: Word (and pdfplumber) are only needed to refresh oracle data.
      - name: Unit tests for compare / flow_score
        run: python -m unittest discover -s tests -t . -v

      - name: Editing task self-test (references pass, counterexamples fail)
        run: ./deval edit --selftest

      - name: Case registry loads
        run: ./deval cases